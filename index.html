<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Calculadora</title>
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Projeto Calculadora</h1>
    <form action="#" class="box">
        <input type="text" id="num1" placeholder="Primeiro número">
        <input type="text" id="num2" placeholder="Segundo número">
    
        <div class="btn-area">
            <button id="btnSomar">+</button>
            <button id="btnSubtrair"> — </button>
            <button id="btnMultiplicar">X</button>
            <button id="btnDivisao">%</button>
            <button id="btnLimpar">Limpar</button>
        </div>
    </form>
    <div class="box invisible">
        <p id="resultado"></p>              
    </div>
</body>
</html>
